allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
blockExoticSubdeps: false
# Transitive plugins of eslint-config-next work with ESLint 10 but their
# published peer ranges stop at ^9. Remove once they include ^10 upstream:
#   eslint-plugin-react  -> https://github.com/jsx-eslint/eslint-plugin-react
#   eslint-plugin-import -> https://github.com/import-js/eslint-plugin-import
#   eslint-plugin-jsx-a11y -> https://github.com/jsx-eslint/eslint-plugin-jsx-a11y
peerDependencyRules:
  allowedVersions:
    eslint-plugin-react>eslint: "*"
    eslint-plugin-import>eslint: "*"
    eslint-plugin-jsx-a11y>eslint: "*"